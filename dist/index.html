<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3db8e8" />
    <meta name="description" content="Minik Kalem — İlkokula yeni başlayan çocuklar için harf ve rakam yazma uygulaması" />
    <title>Minik Kalem — Yazmayı Öğren!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-CZ-n0Jkp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CIMQhmgn.css">
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="cloud c1"></span>
      <span class="cloud c2"></span>
      <span class="cloud c3"></span>
      <span class="balloon b1"></span>
      <span class="balloon b2"></span>
    </div>

    <div id="app">
      <!-- Ana ekran -->
      <section id="screen-home" class="screen active" aria-label="Ana sayfa">
        <header class="hero">
          <p class="brand">Minik Kalem</p>
          <h1>Yazmayı öğrenelim!</h1>
          <p class="tagline">Harfleri ve rakamları parmağınla çiz, yıldızları topla.</p>
        </header>
        <div class="home-actions">
          <button type="button" class="big-btn letters" data-mode="letters">
            <span class="btn-icon" aria-hidden="true">Aa</span>
            <span class="btn-label">Harfler</span>
            <span class="btn-sub">Türk alfabesi</span>
          </button>
          <button type="button" class="big-btn numbers" data-mode="numbers">
            <span class="btn-icon" aria-hidden="true">123</span>
            <span class="btn-label">Rakamlar</span>
            <span class="btn-sub">0'dan 9'a</span>
          </button>
        </div>
        <p class="stars-summary" id="stars-summary">⭐ 0 yıldız</p>
      </section>

      <!-- Seçim ekranı -->
      <section id="screen-pick" class="screen" aria-label="Seçim">
        <header class="top-bar">
          <button type="button" class="icon-btn" id="btn-back-home" aria-label="Geri">←</button>
          <h2 id="pick-title">Harfler</h2>
          <span class="spacer"></span>
        </header>
        <div class="pick-grid" id="pick-grid" role="list"></div>
      </section>

      <!-- Yazma ekranı -->
      <section id="screen-write" class="screen" aria-label="Yazma alanı">
        <header class="top-bar write-bar">
          <button type="button" class="icon-btn" id="btn-back-pick" aria-label="Geri">←</button>
          <div class="current-char-wrap">
            <span class="current-label">Şimdi yaz:</span>
            <span class="current-char" id="current-char">A</span>
          </div>
          <div class="star-count" id="star-count" aria-live="polite">⭐ 0</div>
        </header>

        <div class="canvas-stage">
          <canvas id="guide-canvas" aria-hidden="true"></canvas>
          <canvas id="draw-canvas" aria-label="Yazma alanı — parmağınla çiz"></canvas>
          <div class="celebrate" id="celebrate" hidden>
            <p class="celebrate-text">Harikasın!</p>
            <div class="burst" aria-hidden="true"></div>
          </div>
        </div>

        <div class="palette" role="toolbar" aria-label="Kalem renkleri">
          <button type="button" class="swatch active" data-color="#e85d4c" aria-label="Mercan" style="--c:#e85d4c"></button>
          <button type="button" class="swatch" data-color="#2bb673" aria-label="Yeşil" style="--c:#2bb673"></button>
          <button type="button" class="swatch" data-color="#3b82f6" aria-label="Mavi" style="--c:#3b82f6"></button>
          <button type="button" class="swatch" data-color="#f5a623" aria-label="Sarı" style="--c:#f5a623"></button>
          <button type="button" class="swatch" data-color="#8b5e3c" aria-label="Kahverengi" style="--c:#8b5e3c"></button>
          <button type="button" class="swatch" data-color="#1f2937" aria-label="Siyah" style="--c:#1f2937"></button>
        </div>

        <div class="write-actions">
          <button type="button" class="action-btn" id="btn-clear">Temizle</button>
          <button type="button" class="action-btn primary" id="btn-done">Bitti ⭐</button>
          <button type="button" class="action-btn" id="btn-next">Sonraki →</button>
        </div>
      </section>
    </div>

  </body>
</html>
