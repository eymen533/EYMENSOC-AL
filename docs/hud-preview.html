<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pulse HUD · xcode-ble-6</title>
<style>
  :root {
    --ink: #fff;
    --muted: rgba(255,255,255,.55);
    --dim: rgba(255,255,255,.22);
    --accent: #59d9c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0a0a0a; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 18px;
  }
  .phone {
    width: min(980px, 100%); aspect-ratio: 19.5 / 9;
    background: #000; border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    display: grid; grid-template-rows: 40px 1fr;
  }
  .top {
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.92), rgba(0,0,0,.2));
    font-size: 13px; z-index: 2;
  }
  .pill { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .batt {
    background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px 8px;
    font-variant-numeric: tabular-nums;
  }
  .main {
    display: grid; grid-template-columns: 28% 34px 30% 1fr; min-height: 0;
  }
  .left {
    padding: 14px 16px 40px; background: #000; position: relative;
  }
  .left h3 { margin: 0 0 6px; font-weight: 500; color: var(--muted); font-size: 12px; }
  .left .val { font-size: 22px; font-weight: 600; margin-bottom: 14px; }
  .batt-chip {
    position: absolute; left: 16px; bottom: 12px; display: flex; gap: 6px; align-items: center;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .batt-chip .g { color: #59d972; }
  .rail {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .rail span {
    width: 26px; height: 26px; display: grid; place-items: center; color: var(--dim); font-size: 12px;
  }
  .rail span.on { color: #fff; outline: 1px solid rgba(255,255,255,.7); border-radius: 5px; }
  .center {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(90deg, #000 60%, rgba(0,0,0,.15));
  }
  .gears { display: flex; gap: 18px; font-weight: 700; font-size: 18px; }
  .gears .p { color: #f273d9; } .gears .r { color: var(--dim); }
  .gears .n { color: var(--dim); } .gears .d { color: #59b3ff; }
  .dial {
    width: 210px; height: 210px; border-radius: 50%; background: #000;
    display: grid; place-items: center; box-shadow: -10px 0 28px rgba(0,0,0,.55);
    position: relative;
  }
  .ring {
    position: absolute; inset: 6px; border-radius: 50%;
    background: conic-gradient(from -90deg, #59d9c0 0 18%, transparent 18% 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  }
  .speed { font-size: 84px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; }
  .unit { text-align: center; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .place { color: var(--muted); font-size: 12px; }
  .map {
    position: relative; overflow: hidden;
    background: #cfd8c8
      linear-gradient(180deg, rgba(180,200,160,.35), transparent 40%);
  }
  .map-grid {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 26px, rgba(255,255,255,.35) 26px 28px),
      repeating-linear-gradient(0deg, transparent 0 26px, rgba(255,255,255,.28) 26px 28px),
      linear-gradient(#d7e0cc, #c5d0b8);
  }
  .map::before {
    content: ""; position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(90deg, rgba(0,0,0,.95), rgba(0,0,0,.35), transparent 48px);
    pointer-events: none;
  }
  .apple-badge {
    position: absolute; left: 56px; top: 12px; z-index: 3;
    background: rgba(255,255,255,.92); color: #111; font-size: 11px; font-weight: 700;
    padding: 4px 8px; border-radius: 999px;
  }
  .blocks {
    position: absolute; inset: 18% 12% 28% 18%; z-index: 1;
    background:
      linear-gradient(#b7c2a8, #b7c2a8) 10% 20% / 18% 28% no-repeat,
      linear-gradient(#aeb9a0, #aeb9a0) 40% 35% / 22% 40% no-repeat,
      linear-gradient(#c2ccb4, #c2ccb4) 70% 15% / 16% 32% no-repeat,
      linear-gradient(#9eaa90, #9eaa90) 55% 70% / 20% 22% no-repeat;
  }
  .route {
    position: absolute; left: 22%; top: 30%; width: 58%; height: 48%; z-index: 1;
    border: 0; border-left: 6px solid #1a73e8; border-bottom: 6px solid #1a73e8;
    border-radius: 0 0 0 40px;
    filter: drop-shadow(0 0 4px rgba(26,115,232,.45));
  }
  .car {
    position: absolute; left: 24%; bottom: 28%; z-index: 1;
    width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-bottom: 16px solid #e53935;
    transform: rotate(28deg);
    filter: drop-shadow(0 1px 1px #fff);
  }
  .compass {
    position: absolute; right: 12px; bottom: 42px; width: 36px; height: 36px; z-index: 3;
    border-radius: 50%; background: rgba(255,255,255,.92); color: #222;
    display: grid; place-items: center; font-size: 10px; font-weight: 700;
  }
  .odo {
    position: absolute; right: 12px; bottom: 12px; z-index: 3;
    background: rgba(255,255,255,.9); color: rgba(0,0,0,.7);
    font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 600;
    padding: 4px 8px; border-radius: 999px;
  }
  .model-y {
    width: 42%; max-width: 120px; margin: 8px auto 0; display: block;
    filter: brightness(10) contrast(1.1);
    opacity: .9;
  }
  .tires {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px 8px; margin-top: 8px;
    font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .caption {
    max-width: 980px; width: 100%; margin-top: 14px; color: rgba(255,255,255,.65);
    font-size: 14px; line-height: 1.45;
  }
  .caption a { color: #7de3d0; }
  .tag {
    display: inline-block; background: rgba(89,217,192,.15); color: #9ff3e4;
    border: 1px solid rgba(89,217,192,.35); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; margin-bottom: 8px;
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
  .tabs button {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .tabs button.active { background: rgba(89,217,192,.2); border-color: rgba(89,217,192,.5); }
</style>
</head>
<body>
  <div>
    <div class="phone">
      <div class="top">
        <span>‹</span>
        <strong>19:40</strong>
        <span style="color:var(--muted)">29°C</span>
        <span style="color:var(--accent)">▣</span>
        <div class="pill">
          <span style="color:var(--muted);font-size:12px">BLE LIVE</span>
          <span class="batt">🔋 69</span>
          <span style="color:var(--muted)">⚙</span>
        </div>
      </div>
      <div class="main">
        <div class="left" id="left"></div>
        <div class="rail">
          <span>□</span><span class="on">🚗</span><span>➤</span><span>🗺</span><span>♪</span>
        </div>
        <div class="center">
          <div class="gears"><span class="p">P</span><span class="r">R</span><span class="n">N</span><span class="d">D</span></div>
          <div class="dial"><div class="ring"></div><div><div class="speed">0</div><div class="unit">km/h</div></div></div>
          <div class="place">📍 Ertürk Sk. No:29</div>
        </div>
        <div class="map">
          <div class="map-grid"></div>
          <div class="apple-badge"> Apple Maps · API key yok</div>
          <div class="blocks"></div>
          <div class="route"></div>
          <div class="car"></div>
          <div class="compass">N</div>
          <div class="odo">ODO 74832km</div>
        </div>
      </div>
    </div>

    <div class="caption">
      <div class="tag">xcode-ble-4 · güncel görsel</div>
      <div><strong>Güncel:</strong> Model Y lastik · Apple Maps (key yok) · araç GPS/rota · Performans/Düşük</div>
      <div class="tabs">
        <button class="active" onclick="setPanel('lastik', this)">Lastik (Model Y)</button>
        <button onclick="setPanel('rota', this)">Rota</button>
        <button onclick="setPanel('medya', this)">Medya</button>
      </div>
      <p style="margin:.8rem 0 0">
        <a href="https://github.com/eymen533/EYMENSOC-AL/pull/7/files" target="_blank" rel="noopener">PR farkı</a>
        ·
        <a href="https://github.com/eymen533/EYMENSOC-AL/tree/cursor/ble-pair-fix-02d8/ios/PulsePhoneKey" target="_blank" rel="noopener">Xcode kaynak</a>
      </p>
    </div>
  </div>
<script>
const modelY = "https://raw.githubusercontent.com/eymen533/EYMENSOC-AL/cursor/ble-pair-fix-02d8/tesla_dash/assets/model-y-top.png";
function setPanel(kind, btn){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const left = document.getElementById('left');
  if(kind==='lastik'){
    left.innerHTML = `
      <div style="text-align:center">
        <img class="model-y" src="${modelY}" alt="Model Y"/>
        <div class="tires">
          <span>42 psi</span><span style="text-align:right">42 psi</span>
          <span>41 psi</span><span style="text-align:right">42 psi</span>
        </div>
      </div>
      <div class="batt-chip"><span class="g">🔋</span><span>69% / 331km</span></div>`;
  } else if(kind==='medya'){
    left.innerHTML = `
      <h3>YouTube Music</h3>
      <div style="width:88px;height:88px;border-radius:10px;background:linear-gradient(135deg,#e65a33,#731c19);display:grid;place-items:center;font-size:28px;margin:8px 0">♪</div>
      <div class="val" style="margin:0">Kayıp Kalp</div>
      <div style="color:var(--muted)">BLOK3</div>
      <div class="batt-chip"><span class="g">🔋</span><span>69% / 331km</span></div>`;
  } else {
    left.innerHTML = `
      <h3>Destination</h3><div class="val">Sabiha Gökçen</div>
      <h3>Arrival Time</h3><div class="val">19:12</div>
      <h3>Energy at Arrival</h3><div class="val">66%</div>
      <h3>Distance</h3><div class="val">13.3 km</div>
      <div class="batt-chip"><span class="g">🔋</span><span>69% / 331km</span></div>`;
  }
}
setPanel('lastik', document.querySelector('.tabs button'));
</script>
</body>
</html>
