<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SOC — Dashboard Preview</title>
  <style>
    :root {
      --bg: #000;
      --muted: #9a9a9a;
      --soft: #6c6c6c;
      --accent: #5a73ff;
      --green: #40d166;
      --warn: #f0c738;
      --red: #f23838;
      --surface: #17171a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b0f;
      color: #fff;
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(70, 90, 180, 0.28), transparent 60%),
        #09090c;
    }
    .wrap {
      width: min(1100px, 100%);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 14px;
    }
    .phone {
      aspect-ratio: 19.5 / 9;
      width: 100%;
      border-radius: 28px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      overflow: hidden;
      position: relative;
    }
    .dash {
      display: grid;
      grid-template-columns: 0.95fr 0.85fr 1.2fr;
      height: 100%;
      position: relative;
    }
    .topbar {
      position: absolute;
      inset: 10px 14px auto 14px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #ddd;
    }
    .topbar .muted { color: var(--muted); }
    .spacer { flex: 1; }
    .pill {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      background: var(--surface);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .dot.g { background: var(--green); }
    .dot.y { background: var(--warn); opacity: 0.45; }
    .btn {
      background: var(--surface);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      color: #fff;
    }
    .left, .center, .right {
      position: relative;
      min-width: 0;
      height: 100%;
    }
    .left {
      padding: 48px 10px 18px 48px;
      display: flex;
      flex-direction: column;
    }
    .rail {
      position: absolute;
      left: 8px;
      top: 42%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rail span {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--soft);
      font-size: 14px;
    }
    .rail span.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .car {
      flex: 1;
      display: grid;
      place-items: center;
      position: relative;
    }
    .car svg { width: min(180px, 70%); opacity: 0.85; }
    .tire {
      position: absolute;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .tire.fl { left: 8%; top: 22%; }
    .tire.fr { right: 8%; top: 22%; }
    .tire.rl { left: 8%; bottom: 28%; }
    .tire.rr { right: 8%; bottom: 28%; }
    .battery {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .battery .ico { color: var(--green); }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-top: 20px;
    }
    .gauge {
      width: min(250px, 78%);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 70%);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 20px 50px rgba(0,0,0,0.4);
      animation: breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .gears {
      display: flex;
      gap: 16px;
      color: var(--soft);
      font-size: 15px;
      margin-bottom: 6px;
    }
    .gears b { color: #fff; }
    .speed {
      font-size: clamp(56px, 9vw, 88px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .unit { color: var(--muted); font-size: 15px; margin-top: 4px; }
    .place {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .right {
      background:
        linear-gradient(180deg, rgba(0,0,0,0.45), transparent 18%, transparent 75%, rgba(0,0,0,0.45)),
        linear-gradient(135deg, #2a2d33 0%, #1a1c20 45%, #101215 100%);
      overflow: hidden;
    }
    .map {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .block {
      position: absolute;
      background: #4a4e56;
      border: 1px solid rgba(255,255,255,0.05);
      transform: skewX(-18deg) rotateX(40deg);
      box-shadow: 8px 10px 0 rgba(0,0,0,0.25);
    }
    .road {
      position: absolute;
      background: rgba(255,255,255,0.16);
      transform: skewX(-18deg);
    }
    .label {
      position: absolute;
      color: rgba(255,255,255,0.45);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .arrow {
      position: absolute;
      left: 46%;
      bottom: 26%;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 22px solid var(--red);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      transform: rotate(-8deg);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: rotate(-8deg) translateY(0); }
      50% { transform: rotate(-8deg) translateY(-3px); }
    }
    .compass {
      position: absolute;
      right: 14px;
      bottom: 42px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.2);
      display: grid;
      place-items: center;
      font-size: 11px;
    }
    .compass b { color: var(--red); display: block; text-align: center; }
    .odo {
      position: absolute;
      right: 14px;
      bottom: 14px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .home {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      z-index: 6;
    }
    .links {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .links a {
      color: #c9d2ff;
      background: rgba(90,115,255,0.12);
      border: 1px solid rgba(90,115,255,0.35);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
    }
    @media (max-width: 720px) {
      .dash { grid-template-columns: 1fr; }
      .right { min-height: 220px; }
      .phone { aspect-ratio: auto; height: auto; }
      .left { min-height: 260px; }
    }
  </style>
</head>
<body>

</body>
