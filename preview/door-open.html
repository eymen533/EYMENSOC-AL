<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse28 — Model Y kapı açılma önizleme</title>
<style>
  :root {
    --amber: #ff9e2e;
    --amber-hot: #ffd159;
    --cabin: #ff7320;
    --bg: #0a0a0c;
    --card: #121216;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background:
      radial-gradient(ellipse at 50% 30%, #1a1420 0%, var(--bg) 55%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.55);
    margin: 0;
  }
  .card {
    background: rgba(12,12,15,0.94);
    border: 1.4px solid rgba(255,158,46,0.45);
    border-radius: 22px;
    padding: 18px 20px 16px;
    box-shadow:
      0 18px 40px rgba(0,0,0,0.55),
      0 0 28px rgba(255,158,46,0.18);
    width: min(280px, 92vw);
    text-align: center;
  }
  .stage {
    position: relative;
    width: 160px;
    height: 200px;
    margin: 0 auto 12px;
    perspective: 700px;
  }
  .car-wrap {
    position: absolute;
    inset: 10px 26px 28px;
    transform: rotateX(18deg) rotateY(-5deg);
    transform-style: preserve-3d;
  }
  .glow {
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 120px;
    height: 36px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(255,158,46,0.35), transparent 70%);
    filter: blur(6px);
    animation: pulse 1.1s ease-in-out infinite alternate;
  }
  .cabin {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 42%;
    height: 48%;
    transform: translate(-50%, -50%);
    background: rgba(255,115,32,0.45);
    border-radius: 8px;
    filter: blur(10px);
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .cabin.on { opacity: 1; animation: pulse 1.1s ease-in-out infinite alternate; }

  .car, .slice {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
  }
  .car { filter: drop-shadow(0 10px 14px rgba(0,0,0,0.65)); }

  /* Door / lid slices — clipped regions of the same image */
  .slice {
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    transform-origin: center center;
  }
  .door {
    /* paint edge when open */
  }
  .door::after {
    content: "";
    position: absolute;
    border-radius: 2px;
    border: 1.2px solid transparent;
    pointer-events: none;
  }

  /* Approximate Model Y top-down door regions */
  .door-fl {
    clip-path: inset(30% 72% 48% 6%);
    transform-origin: 28% 41%;
  }
  .door-fr {
    clip-path: inset(30% 6% 48% 72%);
    transform-origin: 72% 41%;
  }
  .door-rl {
    clip-path: inset(52% 72% 28% 6%);
    transform-origin: 28% 62%;
  }
  .door-rr {
    clip-path: inset(52% 6% 28% 72%);
    transform-origin: 72% 62%;
  }
  .frunk {
    clip-path: inset(8% 14% 72% 14%);
    transform-origin: 50% 28%;
  }
  .trunk {
    clip-path: inset(72% 11% 6% 11%);
    transform-origin: 50% 72%;
  }

  .open .door-fl { transform: rotate(-58deg); filter: drop-shadow(0 0 8px rgba(255,158,46,0.55)); }
  .open .door-fr { transform: rotate(58deg); filter: drop-shadow(0 0 8px rgba(255,158,46,0.55)); }
  .open .door-rl { transform: rotate(-58deg); filter: drop-shadow(0 0 8px rgba(255,158,46,0.55)); }
  .open .door-rr { transform: rotate(58deg); filter: drop-shadow(0 0 8px rgba(255,158,46,0.55)); }
  .open .frunk {
    transform: perspective(420px) rotateX(-72deg);
    filter: drop-shadow(0 0 10px rgba(255,158,46,0.5));
  }
  .open .trunk {
    transform: perspective(420px) rotateX(75deg);
    filter: drop-shadow(0 0 10px rgba(255,158,46,0.5));
  }

  .gap {
    position: absolute;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(255,115,32,0.9), rgba(0,0,0,0.85));
    opacity: 0;
    transition: opacity 0.4s ease;
    box-shadow: 0 0 8px rgba(255,115,32,0.6);
  }
  .open .gap { opacity: 1; }
  .gap-fl { left: 10%; top: 33%; width: 14%; height: 16%; }
  .gap-fr { right: 10%; top: 33%; width: 14%; height: 16%; }
  .gap-rl { left: 10%; top: 54%; width: 14%; height: 15%; }
  .gap-rr { right: 10%; top: 54%; width: 14%; height: 15%; }

  .label {
    font-size: 17px;
    font-weight: 700;
    color: var(--amber-hot);
    margin: 0 0 2px;
  }
  .sub {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.72);
    margin: 0 0 14px;
  }
  .btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  button {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #fff;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: rgba(255,158,46,0.18); border-color: rgba(255,158,46,0.45); }
  button.active {
    background: rgba(255,158,46,0.28);
    border-color: var(--amber);
    color: var(--amber-hot);
  }
  .hint {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    max-width: 320px;
    text-align: center;
    line-height: 1.4;
  }
  @keyframes pulse {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <h1>PULSE28 · MODEL Y KAPİ ANİMASYONU</h1>

  <div class="card">
    <div class="stage" id="stage">
      <div class="glow"></div>
      <div class="car-wrap" id="car">
        <div class="cabin" id="cabin"></div>
        <div class="gap gap-fl" data-for="fl"></div>
        <div class="gap gap-fr" data-for="fr"></div>
        <div class="gap gap-rl" data-for="rl"></div>
        <div class="gap gap-rr" data-for="rr"></div>
        <img class="car" src="model-y-top.png" alt="Model Y" />
        <img class="slice door door-fl" data-part="fl" src="model-y-top.png" alt="" />
        <img class="slice door door-fr" data-part="fr" src="model-y-top.png" alt="" />
        <img class="slice door door-rl" data-part="rl" src="model-y-top.png" alt="" />
        <img class="slice door door-rr" data-part="rr" src="model-y-top.png" alt="" />
        <img class="slice frunk" data-part="frunk" src="model-y-top.png" alt="" />
        <img class="slice trunk" data-part="trunk" src="model-y-top.png" alt="" />
      </div>
    </div>
    <p class="label" id="label">Kapalı</p>
    <p class="sub" id="sub">Bir panel seç</p>
    <div class="btns">
      <button type="button" data-key="fl">Sol ön</button>
      <button type="button" data-key="fr">Sağ ön</button>
      <button type="button" data-key="rl">Sol arka</button>
      <button type="button" data-key="rr">Sağ arka</button>
      <button type="button" data-key="frunk">Frunk</button>
      <button type="button" data-key="trunk">Bagaj</button>
      <button type="button" data-key="all">Hepsi</button>
      <button type="button" data-key="none">Kapat</button>
    </div>
  </div>

  <p class="hint">HUD’daki kadran üstü uyarı bunun animasyonlu hâli. Telefondaki build: xcode-ble-78.</p>

<script>
  const car = document.getElementById('car');
  const cabin = document.getElementById('cabin');
  const label = document.getElementById('label');
  const sub = document.getElementById('sub');
  const names = {
    fl: 'Sol ön', fr: 'Sağ ön', rl: 'Sol arka', rr: 'Sağ arka',
    frunk: 'Frunk', trunk: 'Bagaj'
  };
  const open = new Set();

  function apply() {
    document.querySelectorAll('.slice').forEach(el => {
      const k = el.dataset.part;
      el.classList.toggle('open-part', open.has(k));
    });
    // class on wrap drives CSS .open .door-fl etc — per-part via inline for multi
    ['fl','fr','rl','rr','frunk','trunk'].forEach(k => {
      car.classList.toggle('open-' + k, open.has(k));
    });
    car.classList.toggle('open', open.size > 0);
    // Force per-door by temporarily setting all then using CSS variables — simpler: rewrite CSS classes
    document.querySelectorAll('.door-fl,.door-fr,.door-rl,.door-rr,.frunk,.trunk').forEach(el => {
      const k = el.dataset.part;
      el.style.transform = '';
      if (!open.has(k)) return;
      if (k === 'fl' || k === 'rl') el.style.transform = 'rotate(-58deg)';
      if (k === 'fr' || k === 'rr') el.style.transform = 'rotate(58deg)';
      if (k === 'frunk') el.style.transform = 'perspective(420px) rotateX(-72deg)';
      if (k === 'trunk') el.style.transform = 'perspective(420px) rotateX(75deg)';
      el.style.filter = 'drop-shadow(0 0 8px rgba(255,158,46,0.55))';
    });
    document.querySelectorAll('.gap').forEach(g => {
      g.style.opacity = open.has(g.dataset.for) ? '1' : '0';
    });
    cabin.classList.toggle('on', [...open].some(k => ['fl','fr','rl','rr','frunk','trunk'].includes(k)));

    const labs = [...open].filter(k => names[k]).map(k => names[k]);
    label.textContent = labs.length ? labs.join(' · ') : 'Kapalı';
    if (!labs.length) sub.textContent = 'Bir panel seç';
    else if (open.has('frunk')) sub.textContent = 'Ön kaput açılıyor';
    else if (open.has('trunk')) sub.textContent = 'Bagaj açılıyor';
    else sub.textContent = labs.length > 1 ? 'Açık paneller' : 'Kapı açılıyor';

    document.querySelectorAll('.btns button').forEach(b => {
      const k = b.dataset.key;
      if (k === 'all' || k === 'none') {
        b.classList.remove('active');
        return;
      }
      b.classList.toggle('active', open.has(k));
    });
  }

  document.querySelectorAll('.btns button').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.key;
      if (k === 'none') open.clear();
      else if (k === 'all') ['fl','fr','rl','rr','frunk','trunk'].forEach(x => open.add(x));
      else if (open.has(k)) open.delete(k);
      else open.add(k);
      apply();
    });
  });

  // Demo loop: open front-left, then trunk, then close
  let demo = 0;
  const sequence = [
    () => { open.clear(); open.add('fl'); apply(); },
    () => { open.add('fr'); apply(); },
    () => { open.clear(); open.add('trunk'); apply(); },
    () => { open.clear(); open.add('frunk'); apply(); },
    () => { open.clear(); apply(); },
  ];
  sequence[0]();
  setInterval(() => {
    demo = (demo + 1) % sequence.length;
    sequence[demo]();
  }, 2200);
</script>
</body>
</html>
