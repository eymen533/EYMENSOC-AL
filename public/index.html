<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#02060c" />
  <title>EYMEN Cluster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/cluster.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="cockpit">
    <header class="hud-top">
      <div class="brand-block">
        <div class="brand">EYMEN</div>
        <div class="brand-sub">DIGITAL COCKPIT</div>
      </div>
      <div class="status-chip" id="connStatus" data-state="wait">
        <span class="dot"></span><span id="connText">BAĞLANIYOR</span>
      </div>
      <button type="button" id="unitBtn" class="chip-btn">km/h</button>
    </header>

    <section class="hud-main">
      <!-- Left gauge: speed -->
      <div class="gauge-col">
        <div class="dial">
          <svg viewBox="0 0 320 320" class="gauge-svg">
            <defs>
              <linearGradient id="arcSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1a6cff" />
                <stop offset="55%" stop-color="#5ee7ff" />
                <stop offset="100%" stop-color="#e8ffff" />
              </linearGradient>
            </defs>
            <circle class="face" cx="160" cy="160" r="142" />
            <circle class="track" cx="160" cy="160" r="118" />
            <circle id="speedArc" class="arc" cx="160" cy="160" r="118" stroke="url(#arcSpeed)" stroke-dasharray="0 742" />
            <g id="speedTicks" class="ticks"></g>
          </svg>
          <div class="readout">
            <div class="big" id="speedValue">0</div>
            <div class="unit" id="speedUnit">km/h</div>
          </div>
          <div class="dial-tag">SPEED</div>
        </div>
      </div>

      <!-- Center: icons + gear + map -->
      <div class="center-col">
        <div class="icon-rail" id="iconRail">
          <div class="ico" id="icoL" title="Sol sinyal"><svg viewBox="0 0 24 24"><path d="M14 6l-8 6 8 6V6z"/></svg></div>
          <div class="ico" id="icoBeam" title="Far"><svg viewBox="0 0 24 24"><path d="M3 12h8M14 6c3 2 4.5 4 4.5 6S17 16 14 18M14 9c2 1.2 3 2.4 3 3s-1 1.8-3 3M14 12h7"/></svg></div>
          <div class="ico" id="icoR" title="Sağ sinyal"><svg viewBox="0 0 24 24"><path d="M10 6l8 6-8 6V6z"/></svg></div>
          <div class="ico warn" id="icoP" title="El freni"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="currentColor" font-family="sans-serif">P</text></svg></div>
          <div class="ico warn" id="icoAbs" title="ABS"><span>ABS</span></div>
          <div class="ico warn" id="icoTc" title="TC"><span>TC</span></div>
          <div class="ico warn" id="icoOil" title="Yağ"><svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 11-12 0c0-4 6-11 6-11z"/></svg></div>
          <div class="ico warn" id="icoBat" title="Akü"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="10" rx="1"/><path d="M19 11h2v4h-2M7 12h4M9 10v4"/></svg></div>
          <div class="ico hot" id="icoShift" title="Shift"><span>SHIFT</span></div>
        </div>

        <div class="gear-block">
          <div class="gear" id="gearValue">N</div>
          <div class="gear-label">GEAR</div>
        </div>

        <div class="nav-panel">
          <div class="nav-head">
            <span class="nav-title">NAV · MAP</span>
            <span class="nav-meta" id="navMeta">rota bekleniyor</span>
          </div>
          <canvas id="navMap" width="420" height="220"></canvas>
          <div class="nav-legend">
            <span class="lg trail">iz</span>
            <span class="lg car">araç</span>
            <span class="lg route">rota</span>
          </div>
        </div>

        <div class="pedal-row">
          <div class="pedal"><div class="fill" id="throttleBar"></div><span>THR</span></div>
          <div class="pedal brk"><div class="fill" id="brakeBar"></div><span>BRK</span></div>
        </div>
      </div>

      <!-- Right gauge: RPM -->
      <div class="gauge-col">
        <div class="dial">
          <svg viewBox="0 0 320 320" class="gauge-svg">
            <defs>
              <linearGradient id="arcRpm" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#3aa0ff" />
                <stop offset="70%" stop-color="#dff6ff" />
                <stop offset="100%" stop-color="#ff4d3a" />
              </linearGradient>
            </defs>
            <circle class="face" cx="160" cy="160" r="142" />
            <circle class="track" cx="160" cy="160" r="118" />
            <circle id="rpmArc" class="arc" cx="160" cy="160" r="118" stroke="url(#arcRpm)" stroke-dasharray="0 742" />
            <g id="rpmTicks" class="ticks"></g>
          </svg>
          <div class="readout">
            <div class="big rpm" id="rpmValue">0.0</div>
            <div class="unit">×1000 rpm</div>
          </div>
          <div class="dial-tag">TACHO</div>
        </div>
      </div>
    </section>

    <footer class="hud-bottom">
      <div class="meter">
        <span class="m-lab">FUEL</span>
        <div class="bar"><i id="fuelBar"></i></div>
        <b id="fuelVal">—</b>
      </div>
      <div class="meter">
        <span class="m-lab">TEMP</span>
        <div class="bar temp"><i id="tempBar"></i></div>
        <b id="tempVal">—</b>
      </div>
      <div class="meter" id="turboMeter" hidden>
        <span class="m-lab">BOOST</span>
        <div class="bar"><i id="turboBar"></i></div>
        <b id="turboVal">—</b>
      </div>
      <div class="footer-meta" id="metaInfo">PC köprüsü bekleniyor…</div>
    </footer>
  </main>

  <script src="/js/cluster.js"></script>
  <script src="/js/map.js"></script>
</body>
</html>
